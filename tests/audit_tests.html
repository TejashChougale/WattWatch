<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    window.__wattwatchLocalTestAllowed = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  </script>
  <title>WattWatch - Automated Test Suite</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
  </style>
</head>
<body>
  <h1>WattWatch Test Suite Runner</h1>
  <div id="test-results">Running tests...</div>

  <!-- Test Fixtures for DOM-backed Component Tests -->
  <div id="test-fixtures">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.gstatic.com https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self';">
    <div id="authModal" class="modal-backdrop">
      <button type="button" id="authModalCloseX" style="display: none;"></button>
      <div class="auth-nav-tabs"></div>
      <h3 id="authModalTitle">Sign In</h3>
      <div id="authPane-login" class="auth-tab-pane active"></div>
      <div id="authPane-signup" class="auth-tab-pane"></div>
      <div id="authPane-recovery" class="auth-tab-pane"></div>
      <div id="authPane-resume" class="auth-tab-pane">
        <span id="resumeDisplayName"></span>
        <span id="resumeUsernameSub"></span>
        <span id="resumeAvatarLetter"></span>
        <button id="btnResumeContinue">Continue</button>
      </div>
      <div id="authPane-account" class="auth-tab-pane">
        <span id="accountDisplayName"></span>
        <span id="accountUsernameSub"></span>
        <span id="accountAvatarLetter"></span>
      </div>
      <input id="signupUsername">
      <input id="signupPassword">
      <input id="signupPasswordConfirm">
      <label id="signupImportGuestDataLabel"></label>
      <div id="signupImportGuestDataWrap"></div>
      <input id="recoveryUsername">
      <button id="btnSignupSubmit"></button>
      <button type="button" id="authModalFooterClose" style="display: none;"></button>
    </div>
    <span id="topbarAuthLabel">Sign In</span>
    <span id="topbarGuestBadge" class="badge-guest">Guest</span>
    <button id="btnTopbarAuth"></button>

    <div class="app-layout">
      <aside class="app-sidebar"></aside>
      <main class="app-main"></main>
    </div>

    <div id="overviewComparisonContent"></div>
    <span id="overviewComparisonBadge"></span>

    <table>
      <tbody id="historyTableBody"></tbody>
      <tbody id="applianceTableBody"></tbody>
      <tbody id="tariffSlabsTableBody"></tbody>
    </table>
    <button type="button" id="btnRemoveAllAppliances"></button>
    <div id="applianceEmptyState" style="display: none;">
      <div class="empty-state-title"></div>
      <div class="empty-state-desc"></div>
    </div>
    <div id="applianceTableWrap"></div>
    <span id="applianceCountBadge"></span>
    <span id="applianceTotalUnitsBadge"></span>
    <div id="historyEmptyState" style="display: none;"></div>
    <div id="historyTableWrap"></div>
    <div id="historyComparisonCard"></div>
    <div id="historyDetailModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="historyDetailTitle" aria-hidden="true">
      <div id="historyDetailTitle"></div>
      <div id="historyDetailBody"></div>
    </div>
    <div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle" aria-hidden="true">
      <h3 id="confirmModalTitle"></h3>
      <p id="confirmModalMessage"></p>
      <button type="button" id="confirmModalOkBtn"></button>
    </div>
    <div id="applianceModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
      <h3 id="modalTitle"></h3>
      <form id="applianceForm">
        <input id="modalApplianceName">
        <select id="modalCategory"></select>
        <input id="modalPowerWatts">
        <input id="modalQuantity">
        <input id="modalDailyHours">
        <input id="modalOperatingDays">
        <select id="modalPresetSelect"></select>
        <button type="submit" id="modalSubmitBtn"></button>
      </form>
    </div>
    <div id="reportModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="reportModalTitle" aria-hidden="true">
      <h3 id="reportModalTitle"></h3>
    </div>
  </div>

  <!-- Load Application Modules -->
  <script src="../js/calculations.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/recommendations.js"></script>
  <script>
    // Lightweight test harness mocks for Chart.js and chart rendering
    window.WattWatchCharts = {
      renderOverviewCharts: () => {},
      renderAnalyticsCharts: () => {},
      renderHistoryTrendChart: () => {}
    };
  </script>
  <script src="../js/appliances.js"></script>
  <script src="../js/history.js"></script>
  <script src="../js/simulator.js"></script>
  <script src="../js/report.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>

  <script>
    const results = [];
    function assert(condition, testName, details = '') {
      if (condition) {
        results.push({ name: testName, passed: true, details });
      } else {
        results.push({ name: testName, passed: false, details });
        console.error('FAIL: ' + testName + ' | ' + details);
      }
    }

    function assertAlmostEqual(actual, expected, testName, precision = 0.01) {
      const diff = Math.abs(actual - expected);
      assert(diff <= precision, testName, `Expected ~${expected}, got ${actual} (diff: ${diff.toFixed(4)})`);
    }

    async function runAllTests() {
      const initialLocalStorageSnapshot = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        initialLocalStorageSnapshot[k] = localStorage.getItem(k);
      }

      WattWatchStorage.setTestNamespace('wattwatch_audit_test_');
      const nsKey = (k) => `${WattWatchStorage.getTestNamespace() || ''}${k}`;
      WattWatchApp.init();

      try {
      // 1. Core Energy Calculations
      assertAlmostEqual(WattWatchCalculations.calculateDailyKwh(1000, 1, 1), 1.0, 'Daily kWh (1000W, 1 unit, 1h)');
      assertAlmostEqual(WattWatchCalculations.calculateDailyKwh(75, 2, 8), 1.2, 'Daily kWh (75W, 2 units, 8h)');
      assertAlmostEqual(WattWatchCalculations.calculateDailyKwh(100, 1, 0), 0.0, 'Daily kWh with 0 hours');
      assertAlmostEqual(WattWatchCalculations.calculateDailyKwh(100, 1, 30), 2.4, 'Daily kWh clamps hours > 24 to 24');
      assertAlmostEqual(WattWatchCalculations.calculateMonthlyKwh(1000, 1, 1, 30), 30.0, 'Monthly kWh (1000W, 1h/d, 30d)');
      assertAlmostEqual(WattWatchCalculations.calculateMonthlyKwh(1000, 1, 1, 35), 31.0, 'Monthly kWh clamps days > 31 to 31');
      assertAlmostEqual(WattWatchCalculations.calculateCost(100, 8.5), 850.0, 'Flat cost calculation (100 kWh @ 8.50)');

      // 2. Advanced Tariff Calculator
      const flatSettings = { tariffModel: 'flat', electricityRate: 8.00, fixedCharges: 100, additionalTaxPercent: 5 };
      const flatRes = WattWatchCalculations.calculateAdvancedTariff(200, flatSettings);
      assertAlmostEqual(flatRes.energyCharges, 1600.0, 'Flat tariff energy charges');
      assertAlmostEqual(flatRes.fixedCharge, 100.0, 'Flat tariff fixed charges');
      assertAlmostEqual(flatRes.taxCharges, 85.0, 'Flat tariff tax (5% of 1700)');
      assertAlmostEqual(flatRes.totalCost, 1785.0, 'Flat tariff total bill');
      assertAlmostEqual(flatRes.effectiveRatePerKwh, 8.925, 'Flat tariff effective rate');

      const slabSettings = {
        tariffModel: 'slab',
        electricityRate: 8.00,
        fixedCharges: 110,
        additionalTaxPercent: 5,
        slabConfig: [
          { upTo: 100, rate: 4.50 },
          { upTo: 300, rate: 7.50 },
          { upTo: null, rate: 10.00 }
        ]
      };
      // Test 50 kWh (inside slab 1)
      const slab50 = WattWatchCalculations.calculateAdvancedTariff(50, slabSettings);
      assertAlmostEqual(slab50.energyCharges, 225.0, 'Slab tariff (50 kWh in Tier 1 @ 4.50)');
      assertAlmostEqual(slab50.totalCost, (225 + 110) * 1.05, 'Slab tariff total bill (50 kWh)');

      // Test 250 kWh (100 in Tier 1, 150 in Tier 2)
      const slab250 = WattWatchCalculations.calculateAdvancedTariff(250, slabSettings);
      const expectedEnergy250 = (100 * 4.50) + (150 * 7.50); // 450 + 1125 = 1575
      assertAlmostEqual(slab250.energyCharges, 1575.0, 'Slab tariff (250 kWh crossing Tiers 1 and 2)');
      assertAlmostEqual(slab250.totalCost, (1575 + 110) * 1.05, 'Slab tariff total bill (250 kWh)');

      // Test 450 kWh (100 in Tier 1, 200 in Tier 2, 150 in Tier 3)
      const slab450 = WattWatchCalculations.calculateAdvancedTariff(450, slabSettings);
      const expectedEnergy450 = (100 * 4.50) + (200 * 7.50) + (150 * 10.00); // 450 + 1500 + 1500 = 3450
      assertAlmostEqual(slab450.energyCharges, 3450.0, 'Slab tariff (450 kWh crossing all 3 tiers)');
      assertAlmostEqual(slab450.totalCost, (3450 + 110) * 1.05, 'Slab tariff total bill (450 kWh)');
      assertAlmostEqual(slab450.effectiveRatePerKwh, slab450.totalCost / 450, 'Slab tariff effective rate (450 kWh)');

      // Test 0 kWh edge case
      const slab0 = WattWatchCalculations.calculateAdvancedTariff(0, slabSettings);
      assertAlmostEqual(slab0.energyCharges, 0.0, 'Slab tariff 0 kWh energy charges');
      assert(!isNaN(slab0.effectiveRatePerKwh) && isFinite(slab0.effectiveRatePerKwh), 'Slab tariff 0 kWh effective rate is safe number');

      // 3. Budget Status
      const bUnset = WattWatchCalculations.calculateBudgetStatus(1500, 0);
      assert(bUnset.hasBudget === false, 'Budget tracker handles unset budget (0 INR)');

      const bSafe = WattWatchCalculations.calculateBudgetStatus(1200, 2000);
      assert(bSafe.status === 'safe' && bSafe.warningLevel === null, 'Budget tracker handles safe utilization (60%)');

      const bWarn = WattWatchCalculations.calculateBudgetStatus(1600, 2000);
      assert(bWarn.status === 'warning' && bWarn.warningLevel === 75, 'Budget tracker triggers Caution at 80% (>= 75%)');

      const bCrit = WattWatchCalculations.calculateBudgetStatus(1850, 2000);
      assert(bCrit.status === 'critical' && bCrit.warningLevel === 90, 'Budget tracker triggers Critical at 92.5% (>= 90%)');

      const bExceed = WattWatchCalculations.calculateBudgetStatus(2200, 2000);
      assert(bExceed.status === 'exceeded' && bExceed.warningLevel === 100, 'Budget tracker triggers Exceeded at 110% (>= 100%)');
      assertAlmostEqual(bExceed.remaining, -200, 'Budget tracker calculates exact overage amount');

      // 4. Month-to-Month Snapshot Comparison
      const snap1 = { period: '2026-09', totalKwh: 200, totalCost: 1600 };
      const snap2 = { period: '2026-10', totalKwh: 250, totalCost: 2000 };
      const comp = WattWatchCalculations.compareSnapshots(snap1, snap2);
      assertAlmostEqual(comp.kwhDiff, 50, 'Comparison kWh difference (+50 kWh)');
      assertAlmostEqual(comp.costDiff, 400, 'Comparison cost difference (+₹400)');
      assertAlmostEqual(comp.kwhPercentDiff, 25.0, 'Comparison kWh percent diff (+25%)');
      assertAlmostEqual(comp.costPercentDiff, 25.0, 'Comparison cost percent diff (+25%)');

      // Zero-division comparison edge cases
      const snapZero = { period: '2026-08', totalKwh: 0, totalCost: 0 };
      const compZeroBase = WattWatchCalculations.compareSnapshots(snapZero, snap1);
      assert(!isNaN(compZeroBase.kwhPercentDiff) && isFinite(compZeroBase.kwhPercentDiff), 'Zero baseline comparison does not produce NaN/Infinity');
      assertAlmostEqual(compZeroBase.kwhPercentDiff, 100.0, 'Zero baseline to non-zero handles 100% delta');

      const compBothZero = WattWatchCalculations.compareSnapshots(snapZero, snapZero);
      assertAlmostEqual(compBothZero.kwhPercentDiff, 0.0, 'Both zero comparison gives 0% delta');
      assert(compBothZero.isIdentical === true, 'Both zero comparison flags identical');

      // 5. Carbon Footprint Calculations
      const carbon = WattWatchCalculations.calculateCarbonFootprint(300, 0.82);
      assert(carbon.isAvailable === true, 'Carbon footprint is available with factor');
      assertAlmostEqual(carbon.monthlyKgCO2, 246.0, 'Carbon monthly kg CO2 (300 kWh * 0.82)');
      assertAlmostEqual(carbon.annualMetricTons, (246.0 * 12) / 1000, 'Carbon annual metric tons');
      assertAlmostEqual(carbon.treesEquivalent, Math.round((246.0 * 12) / 21.77), 'Carbon mature tree equivalents');

      const carbonDisabled = WattWatchCalculations.calculateCarbonFootprint(300, null);
      assert(carbonDisabled.isAvailable === false, 'Carbon footprint gracefully handles null factor');

      // 6. JSON Import / Export & Schema Migration
      const sampleExport = WattWatchStorage.exportDataJSON();
      assert(typeof sampleExport === 'string' && sampleExport.toLowerCase().includes('wattwatch'), 'JSON export produces valid payload string');

      // Test legacy v1 JSON import
      const v1Json = JSON.stringify({
        appVersion: '1.0',
        settings: { electricityRate: 7.50, currency: '₹' },
        appliances: [
          { name: 'Legacy Fan', category: 'Cooling', powerWatts: 50, dailyHours: 8, operatingDays: 30, quantity: 2 }
        ]
      });
      const importV1Res = WattWatchStorage.importDataJSON(v1Json);
      assert(importV1Res.success === true, 'Backward compatible import handles v1.0 JSON');
      assert(importV1Res.count === 1, 'Imported 1 legacy appliance');

      // Test invalid JSON import
      const invalidRes = WattWatchStorage.importDataJSON('Not Valid JSON');
      assert(invalidRes.success === false, 'Storage rejects invalid JSON safely');

      // 7. Household Summary & Tariff Consistency
      const testApps = [
        { id: 't1', name: 'AC', powerWatts: 1500, dailyHours: 6, operatingDays: 30, quantity: 1, category: 'Cooling' },
        { id: 't2', name: 'Fridge', powerWatts: 200, dailyHours: 12, operatingDays: 30, quantity: 1, category: 'Kitchen' },
        { id: 't3', name: 'Fan', powerWatts: 50, dailyHours: 10, operatingDays: 30, quantity: 2, category: 'Cooling' }
      ];
      // Monthly kWh: AC = 270 kWh, Fridge = 72 kWh, Fan = 30 kWh -> Total = 372 kWh
      const flatSummary = WattWatchCalculations.calculateHouseholdSummary(testApps, flatSettings);
      assertAlmostEqual(flatSummary.totalMonthlyKwh, 372.0, 'Household summary total monthly kWh');
      let sumFlatAppCosts = flatSummary.appliances.reduce((acc, a) => acc + a.monthlyCost, 0);
      assertAlmostEqual(sumFlatAppCosts, 372.0 * 8.00, 'Flat mode sum of appliance costs matches total energy charge');

      const slabSummary = WattWatchCalculations.calculateHouseholdSummary(testApps, slabSettings);
      assertAlmostEqual(slabSummary.totalMonthlyCost, slabSummary.advancedTariff.totalCost, 'Slab mode household summary total cost matches advanced tariff total');
      let sumSlabAppCosts = slabSummary.appliances.reduce((acc, a) => acc + a.monthlyCost, 0);
      assertAlmostEqual(sumSlabAppCosts, slabSummary.totalMonthlyCost, 'Slab mode sum of appliance costs exactly matches total bill');
      assertAlmostEqual(slabSummary.effectiveRatePerKwh, slabSummary.totalMonthlyCost / 372.0, 'Slab mode summary effective rate per kWh is exact');

      // 8. Simulator Replacement Under Flat and Progressive Slab Tariffs
      const baseApp = testApps[0]; // 1500W AC -> 270 kWh/mo
      // Simulate replacing with 900W AC (same hours: 6h/d, 30d -> 162 kWh/mo, saving 108 kWh/mo)
      const simFlat = WattWatchCalculations.simulateReplacement(baseApp, 900, 6, 30, 1, flatSettings, 30000, 372);
      assertAlmostEqual(simFlat.savings.monthlyKwhSaved, 108.0, 'Simulator monthly kWh saved (108 kWh)');
      assertAlmostEqual(simFlat.savings.monthlyCostSaved, 108.0 * 8.00, 'Simulator flat cost saved (108 * 8.00 = ₹864)');
      assertAlmostEqual(simFlat.savings.paybackMonths, 30000 / 864, 'Simulator flat payback period (34.72 months)');

      // Under Slab settings (372 kWh is in Tier 3 @ ₹10.00/kWh). Saving 108 kWh drops usage from 372 to 264 kWh (crossing into Tier 2 @ ₹7.50/kWh)!
      const simSlab = WattWatchCalculations.simulateReplacement(baseApp, 900, 6, 30, 1, slabSettings, 30000, 372);
      assert(simSlab.tariffMode === 'slab', 'Simulator identifies active slab tariff');
      assert(simSlab.savings.monthlyCostSaved > simFlat.savings.monthlyCostSaved, 'Slab mode captures higher marginal tier savings vs flat rate');
      const billBefore = WattWatchCalculations.calculateAdvancedTariff(372, slabSettings).totalCost;
      const billAfter = WattWatchCalculations.calculateAdvancedTariff(264, slabSettings).totalCost;
      assertAlmostEqual(simSlab.savings.monthlyCostSaved, billBefore - billAfter, 'Simulator slab monthly savings matches exact marginal bill reduction');
      assertAlmostEqual(simSlab.savings.paybackMonths, 30000 / (billBefore - billAfter), 'Simulator slab payback period matches exact marginal payback');

      // Edge case: replacement consumes more energy (negative savings)
      const simHigher = WattWatchCalculations.simulateReplacement(baseApp, 2000, 6, 30, 1, slabSettings, 10000, 372);
      assert(simHigher.savings.isSaving === false, 'Simulator correctly flags negative energy savings');
      assert(simHigher.savings.paybackMonths === null, 'Simulator sets paybackMonths null when no financial savings');

      // 9. Bill History Snapshot with Slab Effective Rate
      WattWatchStorage.saveSettings(slabSettings);
      const testSnap = {
        period: '2026-11',
        periodLabel: 'November 2026',
        totalKwh: slabSummary.totalMonthlyKwh,
        totalCost: slabSummary.totalMonthlyCost,
        electricityRate: slabSummary.effectiveRatePerKwh,
        tariffModel: 'slab',
        tariffBreakdown: slabSummary.advancedTariff,
        appliancesCount: 3,
        totalUnits: 4,
        appliancesSnapshot: JSON.parse(JSON.stringify(slabSummary.appliances))
      };
      WattWatchStorage.saveSnapshot(testSnap);
      const historyList = WattWatchStorage.getHistory();
      const savedSnap = historyList.find(h => h.period === '2026-11');
      assert(savedSnap !== undefined, 'Snapshot saved and retrieved from storage');
      assertAlmostEqual(savedSnap.electricityRate, slabSummary.effectiveRatePerKwh, 'Snapshot preserves exact effective rate in slab mode');
      assertAlmostEqual(savedSnap.appliancesSnapshot.reduce((acc, a) => acc + a.monthlyCost, 0), savedSnap.totalCost, 'Frozen appliance costs in snapshot sum to total cost');

      // Cleanup test snapshot
      WattWatchStorage.deleteSnapshot(savedSnap.id);

      // 10. Zero-Value Tariff Settings Preservation (Audit Fixes)
      const zeroFixedSettings = {
        tariffModel: 'slab',
        electricityRate: 8.00,
        fixedCharges: 0,
        additionalTaxPercent: 5.0,
        slabConfig: [
          { upTo: 100, rate: 5.00 },
          { upTo: null, rate: 8.00 }
        ]
      };
      const resZeroFixed = WattWatchCalculations.calculateAdvancedTariff(150, zeroFixedSettings);
      assertAlmostEqual(resZeroFixed.fixedCharge, 0.0, 'Tariff engine preserves explicit fixedCharges = 0');
      assertAlmostEqual(resZeroFixed.taxCharges, 45.0, 'Tax calculation with fixedCharges = 0 applies only to energy charges');
      assertAlmostEqual(resZeroFixed.totalCost, 945.0, 'Total bill with fixedCharges = 0 is exact');

      const zeroTaxSettings = {
        tariffModel: 'slab',
        electricityRate: 8.00,
        fixedCharges: 110,
        additionalTaxPercent: 0,
        slabConfig: [
          { upTo: 100, rate: 5.00 },
          { upTo: null, rate: 8.00 }
        ]
      };
      const resZeroTax = WattWatchCalculations.calculateAdvancedTariff(150, zeroTaxSettings);
      assertAlmostEqual(resZeroTax.taxPercent, 0.0, 'Tariff engine preserves explicit additionalTaxPercent = 0');
      assertAlmostEqual(resZeroTax.taxCharges, 0.0, 'Tax charge with additionalTaxPercent = 0 is exactly 0 INR');
      assertAlmostEqual(resZeroTax.totalCost, 1010.0, 'Total bill with additionalTaxPercent = 0 is exact');

      const bothZeroSettings = {
        tariffModel: 'slab',
        electricityRate: 8.00,
        fixedCharges: 0,
        additionalTaxPercent: 0,
        slabConfig: [
          { upTo: 100, rate: 5.00 },
          { upTo: null, rate: 8.00 }
        ]
      };
      const resBothZero = WattWatchCalculations.calculateAdvancedTariff(150, bothZeroSettings);
      assertAlmostEqual(resBothZero.totalCost, 900.0, 'Total bill with both zero fixed and zero tax equals pure energy charges');
      assertAlmostEqual(resBothZero.effectiveRatePerKwh, 6.0, 'Effective rate with zero fixed/tax is pure energy rate');

      // 11. Numeric-String Settings Handling & Type Coercion
      const stringSettings = {
        tariffModel: 'slab',
        electricityRate: '8.50',
        fixedCharges: '120.00',
        additionalTaxPercent: '5.5',
        slabConfig: [
          { upTo: '100', rate: '4.50' },
          { upTo: '300', rate: '7.50' },
          { upTo: null, rate: '10.00' }
        ]
      };
      const resStringTariff = WattWatchCalculations.calculateAdvancedTariff(250, stringSettings);
      assert(!isNaN(resStringTariff.totalCost) && isFinite(resStringTariff.totalCost), 'Tariff calculation with numeric strings does not produce NaN');
      assertAlmostEqual(resStringTariff.fixedCharge, 120.0, 'Fixed charge parsed accurately from numeric string');
      assertAlmostEqual(resStringTariff.taxPercent, 5.5, 'Tax percentage parsed accurately from numeric string');
      assertAlmostEqual(resStringTariff.totalCost, 1788.225, 'Total bill with numeric string settings is mathematically accurate');

      const stringZeroSettings = {
        tariffModel: 'slab',
        electricityRate: '8.00',
        fixedCharges: '0',
        additionalTaxPercent: '0',
        slabConfig: [
          { upTo: '100', rate: '5.00' },
          { upTo: null, rate: '8.00' }
        ]
      };
      const resStringZero = WattWatchCalculations.calculateAdvancedTariff(100, stringZeroSettings);
      assertAlmostEqual(resStringZero.fixedCharge, 0.0, 'Numeric string "0" for fixedCharges correctly evaluates to 0');
      assertAlmostEqual(resStringZero.taxPercent, 0.0, 'Numeric string "0" for additionalTaxPercent correctly evaluates to 0');
      assertAlmostEqual(resStringZero.totalCost, 500.0, 'Total bill with string "0" settings is pure energy cost');

      // 12. Missing and Invalid Settings Resilience
      const resEmpty = WattWatchCalculations.calculateAdvancedTariff(100, {});
      assert(!isNaN(resEmpty.totalCost) && isFinite(resEmpty.totalCost), 'Advanced tariff with empty settings object does not crash or return NaN');
      assert(resEmpty.fixedCharge >= 0, 'Fixed charge defaults safely with empty settings');
      assert(resEmpty.taxPercent >= 0, 'Tax percent defaults safely with empty settings');

      const invalidSettings = {
        tariffModel: 'slab',
        electricityRate: 'invalid_rate',
        fixedCharges: 'invalid_fixed',
        additionalTaxPercent: null,
        slabConfig: null
      };
      const resInvalid = WattWatchCalculations.calculateAdvancedTariff(100, invalidSettings);
      assert(!isNaN(resInvalid.totalCost) && isFinite(resInvalid.totalCost), 'Advanced tariff with invalid string/null settings falls back gracefully without NaN');

      const summaryEmpty = WattWatchCalculations.calculateHouseholdSummary(testApps, {});
      assert(!isNaN(summaryEmpty.totalMonthlyCost) && isFinite(summaryEmpty.totalMonthlyCost), 'Household summary with empty settings calculates safe finite cost');
      assert(summaryEmpty.tariffModel === 'flat', 'Household summary with empty settings defaults safely to flat tariff model');

      // 13. Active Tariff Model Persistence (Theme & Timeframe Changes)
      WattWatchStorage.saveSettings(slabSettings);
      const activeSettings = WattWatchStorage.getSettings();
      assert(activeSettings.tariffModel === 'slab', 'Storage correctly returns slab tariff model');

      // Test setTheme contract: passing active settings preserves slab tariff
      const themeSummary = WattWatchCalculations.calculateHouseholdSummary(testApps, activeSettings);
      assert(themeSummary.tariffModel === 'slab', 'Theme update summary preserves active slab tariff model');
      assert(themeSummary.advancedTariff !== null, 'Theme update summary contains advanced tariff breakdown');
      assertAlmostEqual(themeSummary.totalMonthlyCost, slabSummary.totalMonthlyCost, 'Theme update summary total cost matches progressive slab bill');
      assert(themeSummary.totalMonthlyCost !== (themeSummary.totalMonthlyKwh * activeSettings.electricityRate), 'Theme update summary does not accidentally calculate flat rate in slab mode');

      // Test timeframe change contract: passing active settings preserves slab tariff
      const timeframeSummary = WattWatchCalculations.calculateHouseholdSummary(testApps, activeSettings);
      assert(timeframeSummary.tariffModel === 'slab', 'Timeframe update summary preserves active slab tariff model');
      assertAlmostEqual(timeframeSummary.ratePerKwh, slabSummary.effectiveRatePerKwh, 'Timeframe update summary ratePerKwh matches active slab effective rate');
      assertAlmostEqual(timeframeSummary.effectiveRatePerKwh, slabSummary.effectiveRatePerKwh, 'Timeframe update summary effectiveRatePerKwh matches active slab effective rate');

      // 14. UI Format Previews for Zero, Numeric Strings, and Missing Fallbacks
      function formatFixedChargesPreview(val) {
        const rawFixed = Number(val);
        const fixed = (val !== undefined && val !== null && val !== '' && !isNaN(rawFixed))
          ? Math.max(0, rawFixed)
          : 110.00;

        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        return { period, label: `${monthNames[prevDate.getMonth()]} ${prevYear}` };

        && testUserDocInvalid.username.length >= 3
        && testUserDocInvalid.username.length <= 30;
      assert(!isInvalidUserDoc, 'Invalid Firestore user profile with short username rejected by rules criteria');

      // 33. Asynchronous Authentication & Firebase Sign-Out Mock Verification
      const mockAuthInstance = { appId: 'wattwatch-test-app', currentUser: { uid: 'mock_fb_user_123' } };
      let mockSignOutCalled = false;
      let mockSignOutArg = null;
      let shouldRejectSignOut = false;

      const mockSignOutFn = async (auth) => {
        mockSignOutCalled = true;
        mockSignOutArg = auth;
        if (shouldRejectSignOut) {
          throw new Error('Firebase network disconnection simulation');
        }
        return Promise.resolve();
      };

      const savedAuth = WattWatchAuth.auth;
      const savedSignOut = WattWatchAuth.firebaseSignOut;

      try {
        WattWatchAuth.auth = mockAuthInstance;
        WattWatchAuth.firebaseSignOut = mockSignOutFn;

        // Test A: Successful Firebase Sign-Out
        WattWatchStorage.saveAppliances([{ id: 'guest_iso_1', name: 'Guest Kettle', powerWatts: 1500, dailyHours: 0.5, operatingDays: 30, quantity: 1, category: 'Kitchen', createdAt: Date.now() }]);
        WattWatchStorage.setActiveUser('user_session_456');
        WattWatchStorage.saveAppliances([{ id: 'user_app_456', name: 'User AC', powerWatts: 2000, dailyHours: 4, operatingDays: 30, quantity: 1, category: 'Cooling', createdAt: Date.now() }]);

        WattWatchAuth.currentUser = { uid: 'user_session_456', username: 'testuser456', displayName: 'Test User' };
        WattWatchAuth.hasUserChosenSession = true;
        WattWatchAuth.chosenSessionType = 'account';

        mockSignOutCalled = false;
        mockSignOutArg = null;
        shouldRejectSignOut = false;

        const signOutResult = await WattWatchAuth.signOut();

        assert(mockSignOutCalled === true, 'Mocked Firebase sign-out function was executed');
        assert(mockSignOutArg === mockAuthInstance, 'Mocked Firebase sign-out received the expected auth instance');
        assert(signOutResult && signOutResult.success === true, 'signOut() returned success: true on successful resolution');
        assert(WattWatchAuth.currentUser === null, 'Local currentUser cleared after successful sign-out');
        assert(WattWatchAuth.hasUserChosenSession === false, 'Startup session resolution reset to false on sign-out');
        assert(WattWatchAuth.chosenSessionType === null, 'chosenSessionType reset to null on sign-out');
        assert(WattWatchStorage.getActiveUser() === null, 'Active storage user reverted to null on sign-out');
        assert(document.body.classList.contains('auth-gate-active'), 'Startup authentication gate restored on sign-out');
        assert(authModalEl && authModalEl.classList.contains('is-open'), 'Login modal opened after sign-out');
        const loginPaneEl = document.getElementById('authPane-login');
        assert(loginPaneEl && loginPaneEl.classList.contains('active'), 'Login pane is active after sign-out');

        // Verify Guest Mode data was not overwritten or exposed
        WattWatchStorage.setActiveUser(null);
        const guestAppsAfterSignOut = WattWatchStorage.getAppliances();
        assert(guestAppsAfterSignOut.length === 1 && guestAppsAfterSignOut[0].name === 'Guest Kettle', 'Guest inventory remains intact and isolated after sign-out');

        // Test B: Rejected Firebase Sign-Out (failure resilience)
        document.body.classList.remove('auth-gate-active');
        WattWatchAuth.closeModal(true);
        WattWatchAuth.currentUser = { uid: 'user_session_789', username: 'resilientuser', displayName: 'Resilient User' };
        WattWatchAuth.hasUserChosenSession = true;
        WattWatchAuth.chosenSessionType = 'account';
        WattWatchStorage.setActiveUser('user_session_789');

        mockSignOutCalled = false;
        mockSignOutArg = null;
        shouldRejectSignOut = true;

        const failedResult = await WattWatchAuth.signOut();

        assert(mockSignOutCalled === true, 'Mocked Firebase sign-out function was executed on rejection test');
        assert(failedResult && failedResult.success === false, 'signOut() returned success: false on Firebase rejection');
        assert(WattWatchAuth.currentUser !== null, 'currentUser is preserved and NOT falsely wiped when remote sign-out fails');
        assert(WattWatchAuth.currentUser.uid === 'user_session_789', 'Active user UID retained on failed sign-out');
        assert(WattWatchAuth.hasUserChosenSession === true, 'hasUserChosenSession remains true on failed sign-out');
        assert(WattWatchAuth.chosenSessionType === 'account', 'chosenSessionType remains account on failed sign-out');
        assert(WattWatchStorage.getActiveUser() === 'user_session_789', 'Active storage user remains user account on failed sign-out');
        assert(!document.body.classList.contains('auth-gate-active'), 'Auth gate not falsely activated on failed sign-out');

        // Test C: Direct signOutAndSwitchToLogin() resolution
        shouldRejectSignOut = false;
        const switchRes = await WattWatchAuth.signOutAndSwitchToLogin();
        assert(switchRes && switchRes.success === true, 'signOutAndSwitchToLogin() returns success: true on resolution');
        assert(WattWatchAuth.currentUser === null, 'signOutAndSwitchToLogin() cleanly clears currentUser');
      } finally {
        WattWatchAuth.auth = savedAuth;
        WattWatchAuth.firebaseSignOut = savedSignOut;
        WattWatchAuth.closeModal(true);
        WattWatchStorage.setActiveUser(null);
      }

      // Restore sample household for storage
      WattWatchStorage.loadSampleHousehold();
      } catch (err) {
        console.error('Test runner caught unexpected error:', err);
        results.push({ name: 'Test Suite Execution Error', passed: false, details: err.message });
      } finally {
        // Clean up test namespace keys
        const allKeys = Object.keys(localStorage);
        for (const k of allKeys) {
          if (k.startsWith('wattwatch_audit_test_') || (k.includes('wattwatch_corrupted_') && !(k in initialLocalStorageSnapshot))) {
            localStorage.removeItem(k);
          }
        }
        WattWatchStorage.setTestNamespace(null);
        WattWatchStorage.setActiveUser(null);
        WattWatchAuth.closeModal(true);
        document.body.classList.remove('auth-gate-active');

        // Verify real user data was completely untouched
        let realDataUntouched = true;
        for (const k of Object.keys(initialLocalStorageSnapshot)) {
          if (localStorage.getItem(k) !== initialLocalStorageSnapshot[k]) {
            realDataUntouched = false;
            break;
          }
        }
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!(k in initialLocalStorageSnapshot)) {
            realDataUntouched = false;
            break;
          }
        }
        assert(realDataUntouched, 'Production localStorage data was completely untouched during test suite run');

        // Render summary on DOM
        const passedCount = results.filter(r => r.passed).length;
        const failedCount = results.filter(r => !r.passed).length;
        const totalCount = results.length;

        let html = `<div id="summary">TEST_RESULTS: TOTAL=${totalCount} PASSED=${passedCount} FAILED=${failedCount}</div><ul>`;
        results.forEach(r => {
          html += `<li class="${r.passed ? 'pass' : 'fail'}">${r.passed ? 'PASS' : 'FAIL'}: ${r.name} ${r.details ? '(' + r.details + ')' : ''}</li>`;
        });
        html += '</ul>';
        document.getElementById('test-results').innerHTML = html;
      }
    }

    if (window.__wattwatchLocalTestAllowed) {
      runAllTests();
    } else {
      document.getElementById('test-results').textContent =
        'Tests are restricted to a local development server. Open this page at http://localhost or http://127.0.0.1.';
    }
  </script>
</body>
