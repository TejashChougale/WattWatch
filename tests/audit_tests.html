<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WattWatch - Automated Test Suite</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <h1>WattWatch Test Suite Runner</h1>
  <div id="test-results">Running tests...</div>

  <!-- Test Fixtures for DOM-backed Component Tests -->
  <div id="test-fixtures" style="display: none;">
    <div id="authModal" class="modal-backdrop">
      <button type="button" id="authModalCloseX" style="display: none;"></button>
      <div class="auth-nav-tabs"></div>
      <h3 id="authModalTitle">Sign In</h3>
      <div id="authPane-login" class="auth-tab-pane active"></div>
      <div id="authPane-signup" class="auth-tab-pane"></div>
      <div id="authPane-recovery" class="auth-tab-pane"></div>
      <div id="authPane-resume" class="auth-tab-pane">
        <span id="resumeDisplayName"></span>
        <span id="resumeUsernameSub"></span>
        <span id="resumeAvatarLetter"></span>
        <button id="btnResumeContinue">Continue</button>
      </div>
      <div id="authPane-account" class="auth-tab-pane">
        <span id="accountDisplayName"></span>
        <span id="accountUsernameSub"></span>
        <span id="accountAvatarLetter"></span>
      </div>
      <input id="signupUsername">
      <input id="signupPassword">
      <input id="signupPasswordConfirm">
      <label id="signupImportGuestDataLabel"></label>
      <div id="signupImportGuestDataWrap"></div>
      <input id="recoveryUsername">
      <button id="btnSignupSubmit"></button>
      <button type="button" id="authModalFooterClose" style="display: none;"></button>
    </div>
    <span id="topbarAuthLabel">Sign In</span>
    <span id="topbarGuestBadge" class="badge-guest">Guest</span>
    <button id="btnTopbarAuth"></button>

    <div id="overviewComparisonContent"></div>
    <span id="overviewComparisonBadge"></span>

    <table>
      <tbody id="historyTableBody"></tbody>
      <tbody id="applianceTableBody"></tbody>
      <tbody id="tariffSlabsTableBody"></tbody>
    </table>
    <div id="historyEmptyState" style="display: none;"></div>
    <div id="historyTableWrap"></div>
    <div id="historyComparisonCard"></div>
    <div id="historyDetailModal" class="modal-backdrop">
      <div id="historyDetailTitle"></div>
      <div id="historyDetailBody"></div>
    </div>
  </div>

  <!-- Load Application Modules -->
  <script src="../js/calculations.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/recommendations.js"></script>
  <script>
    window.WattWatchCharts = {
      renderHistoryTrendChart: () => {}
    };
    window.WattWatchApp = {
      showToast: () => {},
      refreshAll: () => {},
      navigateTo: () => {},
      openConfirmDialog: (cfg) => { if (cfg && cfg.onConfirm) cfg.onConfirm(); },
      closeConfirmDialog: () => {},
      bindModalKeyboards: function() {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if (typeof WattWatchAuth !== 'undefined' && WattWatchAuth.hasUserChosenSession) {
              WattWatchAuth.closeModal();
            }
          }
        });
        const modal = document.getElementById('authModal');
        if (modal) {
          modal.addEventListener('click', (e) => {
            if (e.target === modal) {
              if (typeof WattWatchAuth !== 'undefined' && WattWatchAuth.hasUserChosenSession) {
                WattWatchAuth.closeModal();
              }
            }
          });
        }
      }
    };
  </script>
  <script src="../js/appliances.js"></script>
  <script src="../js/history.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    const results = [];
    function assert(condition, testName, details = '') {
      if (condition) {
        results.push({ name: testName, passed: true, details });
      } else {
        results.push({ name: testName, passed: false, details });
        console.error('FAIL: ' + testName + ' | ' + details);
      }
    }

    function assertAlmostEqual(actual, expected, testName, precision = 0.01) {
      const diff = Math.abs(actual - expected);
      assert(diff <= precision, testName, `Expected ~${expected}, got ${actual} (diff: ${diff.toFixed(4)})`);
    }

    async function runAllTests() {
      try {
      // 1. Core Energy Calculations
      assertAlmostEqual(WattWatchCalculations.calculateDailyKwh(1000, 1, 1), 1.0, 'Daily kWh (1000W, 1 unit, 1h)');
      assertAlmostEqual(WattWatchCalculations.calculateDailyKwh(75, 2, 8), 1.2, 'Daily kWh (75W, 2 units, 8h)');
      assertAlmostEqual(WattWatchCalculations.calculateDailyKwh(100, 1, 0), 0.0, 'Daily kWh with 0 hours');
      assertAlmostEqual(WattWatchCalculations.calculateDailyKwh(100, 1, 30), 2.4, 'Daily kWh clamps hours > 24 to 24');
      assertAlmostEqual(WattWatchCalculations.calculateMonthlyKwh(1000, 1, 1, 30), 30.0, 'Monthly kWh (1000W, 1h/d, 30d)');
      assertAlmostEqual(WattWatchCalculations.calculateMonthlyKwh(1000, 1, 1, 35), 31.0, 'Monthly kWh clamps days > 31 to 31');
      assertAlmostEqual(WattWatchCalculations.calculateCost(100, 8.5), 850.0, 'Flat cost calculation (100 kWh @ 8.50)');

      // 2. Advanced Tariff Calculator
      const flatSettings = { tariffModel: 'flat', electricityRate: 8.00, fixedCharges: 100, additionalTaxPercent: 5 };
      const flatRes = WattWatchCalculations.calculateAdvancedTariff(200, flatSettings);
      assertAlmostEqual(flatRes.energyCharges, 1600.0, 'Flat tariff energy charges');
      assertAlmostEqual(flatRes.fixedCharge, 100.0, 'Flat tariff fixed charges');
      assertAlmostEqual(flatRes.taxCharges, 85.0, 'Flat tariff tax (5% of 1700)');
      assertAlmostEqual(flatRes.totalCost, 1785.0, 'Flat tariff total bill');
      assertAlmostEqual(flatRes.effectiveRatePerKwh, 8.925, 'Flat tariff effective rate');

      const slabSettings = {
        tariffModel: 'slab',
        electricityRate: 8.00,
        fixedCharges: 110,
        additionalTaxPercent: 5,
        slabConfig: [
          { upTo: 100, rate: 4.50 },
          { upTo: 300, rate: 7.50 },
          { upTo: null, rate: 10.00 }
        ]
      };
      // Test 50 kWh (inside slab 1)
      const slab50 = WattWatchCalculations.calculateAdvancedTariff(50, slabSettings);
      assertAlmostEqual(slab50.energyCharges, 225.0, 'Slab tariff (50 kWh in Tier 1 @ 4.50)');
      assertAlmostEqual(slab50.totalCost, (225 + 110) * 1.05, 'Slab tariff total bill (50 kWh)');

      // Test 250 kWh (100 in Tier 1, 150 in Tier 2)
      const slab250 = WattWatchCalculations.calculateAdvancedTariff(250, slabSettings);
      const expectedEnergy250 = (100 * 4.50) + (150 * 7.50); // 450 + 1125 = 1575
      assertAlmostEqual(slab250.energyCharges, 1575.0, 'Slab tariff (250 kWh crossing Tiers 1 and 2)');
      assertAlmostEqual(slab250.totalCost, (1575 + 110) * 1.05, 'Slab tariff total bill (250 kWh)');

      // Test 450 kWh (100 in Tier 1, 200 in Tier 2, 150 in Tier 3)
      const slab450 = WattWatchCalculations.calculateAdvancedTariff(450, slabSettings);
      const expectedEnergy450 = (100 * 4.50) + (200 * 7.50) + (150 * 10.00); // 450 + 1500 + 1500 = 3450
      assertAlmostEqual(slab450.energyCharges, 3450.0, 'Slab tariff (450 kWh crossing all 3 tiers)');
      assertAlmostEqual(slab450.totalCost, (3450 + 110) * 1.05, 'Slab tariff total bill (450 kWh)');
      assertAlmostEqual(slab450.effectiveRatePerKwh, slab450.totalCost / 450, 'Slab tariff effective rate (450 kWh)');

      // Test 0 kWh edge case
      const slab0 = WattWatchCalculations.calculateAdvancedTariff(0, slabSettings);
      assertAlmostEqual(slab0.energyCharges, 0.0, 'Slab tariff 0 kWh energy charges');
      assert(!isNaN(slab0.effectiveRatePerKwh) && isFinite(slab0.effectiveRatePerKwh), 'Slab tariff 0 kWh effective rate is safe number');

      // 3. Budget Status
      const bUnset = WattWatchCalculations.calculateBudgetStatus(1500, 0);
      assert(bUnset.hasBudget === false, 'Budget tracker handles unset budget (0 INR)');

      const bSafe = WattWatchCalculations.calculateBudgetStatus(1200, 2000);
      assert(bSafe.status === 'safe' && bSafe.warningLevel === null, 'Budget tracker handles safe utilization (60%)');

      const bWarn = WattWatchCalculations.calculateBudgetStatus(1600, 2000);
      assert(bWarn.status === 'warning' && bWarn.warningLevel === 75, 'Budget tracker triggers Caution at 80% (>= 75%)');

      const bCrit = WattWatchCalculations.calculateBudgetStatus(1850, 2000);
      assert(bCrit.status === 'critical' && bCrit.warningLevel === 90, 'Budget tracker triggers Critical at 92.5% (>= 90%)');

      const bExceed = WattWatchCalculations.calculateBudgetStatus(2200, 2000);
      assert(bExceed.status === 'exceeded' && bExceed.warningLevel === 100, 'Budget tracker triggers Exceeded at 110% (>= 100%)');
      assertAlmostEqual(bExceed.remaining, -200, 'Budget tracker calculates exact overage amount');

      // 4. Month-to-Month Snapshot Comparison
      const snap1 = { period: '2026-09', totalKwh: 200, totalCost: 1600 };
      const snap2 = { period: '2026-10', totalKwh: 250, totalCost: 2000 };
      const comp = WattWatchCalculations.compareSnapshots(snap1, snap2);
      assertAlmostEqual(comp.kwhDiff, 50, 'Comparison kWh difference (+50 kWh)');
      assertAlmostEqual(comp.costDiff, 400, 'Comparison cost difference (+₹400)');
      assertAlmostEqual(comp.kwhPercentDiff, 25.0, 'Comparison kWh percent diff (+25%)');
      assertAlmostEqual(comp.costPercentDiff, 25.0, 'Comparison cost percent diff (+25%)');

      // Zero-division comparison edge cases
      const snapZero = { period: '2026-08', totalKwh: 0, totalCost: 0 };
      const compZeroBase = WattWatchCalculations.compareSnapshots(snapZero, snap1);
      assert(!isNaN(compZeroBase.kwhPercentDiff) && isFinite(compZeroBase.kwhPercentDiff), 'Zero baseline comparison does not produce NaN/Infinity');
      assertAlmostEqual(compZeroBase.kwhPercentDiff, 100.0, 'Zero baseline to non-zero handles 100% delta');

      const compBothZero = WattWatchCalculations.compareSnapshots(snapZero, snapZero);
      assertAlmostEqual(compBothZero.kwhPercentDiff, 0.0, 'Both zero comparison gives 0% delta');
      assert(compBothZero.isIdentical === true, 'Both zero comparison flags identical');

      // 5. Carbon Footprint Calculations
      const carbon = WattWatchCalculations.calculateCarbonFootprint(300, 0.82);
      assert(carbon.isAvailable === true, 'Carbon footprint is available with factor');
      assertAlmostEqual(carbon.monthlyKgCO2, 246.0, 'Carbon monthly kg CO2 (300 kWh * 0.82)');
      assertAlmostEqual(carbon.annualMetricTons, (246.0 * 12) / 1000, 'Carbon annual metric tons');
      assertAlmostEqual(carbon.treesEquivalent, Math.round((246.0 * 12) / 21.77), 'Carbon mature tree equivalents');

      const carbonDisabled = WattWatchCalculations.calculateCarbonFootprint(300, null);
      assert(carbonDisabled.isAvailable === false, 'Carbon footprint gracefully handles null factor');

      // 6. JSON Import / Export & Schema Migration
      const sampleExport = WattWatchStorage.exportDataJSON();
      assert(typeof sampleExport === 'string' && sampleExport.toLowerCase().includes('wattwatch'), 'JSON export produces valid payload string');

      // Test legacy v1 JSON import
      const v1Json = JSON.stringify({
        appVersion: '1.0',
        settings: { electricityRate: 7.50, currency: '₹' },
        appliances: [
          { name: 'Legacy Fan', category: 'Cooling', powerWatts: 50, dailyHours: 8, operatingDays: 30, quantity: 2 }
        ]
      });
      const importV1Res = WattWatchStorage.importDataJSON(v1Json);
      assert(importV1Res.success === true, 'Backward compatible import handles v1.0 JSON');
      assert(importV1Res.count === 1, 'Imported 1 legacy appliance');

      // Test invalid JSON import
      const invalidRes = WattWatchStorage.importDataJSON('Not Valid JSON');
      assert(invalidRes.success === false, 'Storage rejects invalid JSON safely');

      // 7. Household Summary & Tariff Consistency
      const testApps = [
        { id: 't1', name: 'AC', powerWatts: 1500, dailyHours: 6, operatingDays: 30, quantity: 1, category: 'Cooling' },
        { id: 't2', name: 'Fridge', powerWatts: 200, dailyHours: 12, operatingDays: 30, quantity: 1, category: 'Kitchen' },
        { id: 't3', name: 'Fan', powerWatts: 50, dailyHours: 10, operatingDays: 30, quantity: 2, category: 'Cooling' }
      ];
      // Monthly kWh: AC = 270 kWh, Fridge = 72 kWh, Fan = 30 kWh -> Total = 372 kWh
      const flatSummary = WattWatchCalculations.calculateHouseholdSummary(testApps, flatSettings);
      assertAlmostEqual(flatSummary.totalMonthlyKwh, 372.0, 'Household summary total monthly kWh');
      let sumFlatAppCosts = flatSummary.appliances.reduce((acc, a) => acc + a.monthlyCost, 0);
      assertAlmostEqual(sumFlatAppCosts, 372.0 * 8.00, 'Flat mode sum of appliance costs matches total energy charge');

      const slabSummary = WattWatchCalculations.calculateHouseholdSummary(testApps, slabSettings);
      assertAlmostEqual(slabSummary.totalMonthlyCost, slabSummary.advancedTariff.totalCost, 'Slab mode household summary total cost matches advanced tariff total');
      let sumSlabAppCosts = slabSummary.appliances.reduce((acc, a) => acc + a.monthlyCost, 0);
      assertAlmostEqual(sumSlabAppCosts, slabSummary.totalMonthlyCost, 'Slab mode sum of appliance costs exactly matches total bill');
      assertAlmostEqual(slabSummary.effectiveRatePerKwh, slabSummary.totalMonthlyCost / 372.0, 'Slab mode summary effective rate per kWh is exact');

      // 8. Simulator Replacement Under Flat and Progressive Slab Tariffs
      const baseApp = testApps[0]; // 1500W AC -> 270 kWh/mo
      // Simulate replacing with 900W AC (same hours: 6h/d, 30d -> 162 kWh/mo, saving 108 kWh/mo)
      const simFlat = WattWatchCalculations.simulateReplacement(baseApp, 900, 6, 30, 1, flatSettings, 30000, 372);
      assertAlmostEqual(simFlat.savings.monthlyKwhSaved, 108.0, 'Simulator monthly kWh saved (108 kWh)');
      assertAlmostEqual(simFlat.savings.monthlyCostSaved, 108.0 * 8.00, 'Simulator flat cost saved (108 * 8.00 = ₹864)');
      assertAlmostEqual(simFlat.savings.paybackMonths, 30000 / 864, 'Simulator flat payback period (34.72 months)');

      // Under Slab settings (372 kWh is in Tier 3 @ ₹10.00/kWh). Saving 108 kWh drops usage from 372 to 264 kWh (crossing into Tier 2 @ ₹7.50/kWh)!
      const simSlab = WattWatchCalculations.simulateReplacement(baseApp, 900, 6, 30, 1, slabSettings, 30000, 372);
      assert(simSlab.tariffMode === 'slab', 'Simulator identifies active slab tariff');
      assert(simSlab.savings.monthlyCostSaved > simFlat.savings.monthlyCostSaved, 'Slab mode captures higher marginal tier savings vs flat rate');
      const billBefore = WattWatchCalculations.calculateAdvancedTariff(372, slabSettings).totalCost;
      const billAfter = WattWatchCalculations.calculateAdvancedTariff(264, slabSettings).totalCost;
      assertAlmostEqual(simSlab.savings.monthlyCostSaved, billBefore - billAfter, 'Simulator slab monthly savings matches exact marginal bill reduction');
      assertAlmostEqual(simSlab.savings.paybackMonths, 30000 / (billBefore - billAfter), 'Simulator slab payback period matches exact marginal payback');

      // Edge case: replacement consumes more energy (negative savings)
      const simHigher = WattWatchCalculations.simulateReplacement(baseApp, 2000, 6, 30, 1, slabSettings, 10000, 372);
      assert(simHigher.savings.isSaving === false, 'Simulator correctly flags negative energy savings');
      assert(simHigher.savings.paybackMonths === null, 'Simulator sets paybackMonths null when no financial savings');

      // 9. Bill History Snapshot with Slab Effective Rate
      WattWatchStorage.saveSettings(slabSettings);
      const testSnap = {
        period: '2026-11',
        periodLabel: 'November 2026',
        totalKwh: slabSummary.totalMonthlyKwh,
        totalCost: slabSummary.totalMonthlyCost,
        electricityRate: slabSummary.effectiveRatePerKwh,
        tariffModel: 'slab',
        tariffBreakdown: slabSummary.advancedTariff,
        appliancesCount: 3,
        totalUnits: 4,
        appliancesSnapshot: JSON.parse(JSON.stringify(slabSummary.appliances))
      };
      WattWatchStorage.saveSnapshot(testSnap);
      const historyList = WattWatchStorage.getHistory();
      const savedSnap = historyList.find(h => h.period === '2026-11');
      assert(savedSnap !== undefined, 'Snapshot saved and retrieved from storage');
      assertAlmostEqual(savedSnap.electricityRate, slabSummary.effectiveRatePerKwh, 'Snapshot preserves exact effective rate in slab mode');
      assertAlmostEqual(savedSnap.appliancesSnapshot.reduce((acc, a) => acc + a.monthlyCost, 0), savedSnap.totalCost, 'Frozen appliance costs in snapshot sum to total cost');

      // Cleanup test snapshot
      WattWatchStorage.deleteSnapshot(savedSnap.id);

      // 10. Zero-Value Tariff Settings Preservation (Audit Fixes)
      const zeroFixedSettings = {
        tariffModel: 'slab',
        electricityRate: 8.00,
        fixedCharges: 0,
        additionalTaxPercent: 5.0,
        slabConfig: [
          { upTo: 100, rate: 5.00 },
          { upTo: null, rate: 8.00 }
        ]
      };
      const resZeroFixed = WattWatchCalculations.calculateAdvancedTariff(150, zeroFixedSettings);
      assertAlmostEqual(resZeroFixed.fixedCharge, 0.0, 'Tariff engine preserves explicit fixedCharges = 0');
      assertAlmostEqual(resZeroFixed.taxCharges, 45.0, 'Tax calculation with fixedCharges = 0 applies only to energy charges');
      assertAlmostEqual(resZeroFixed.totalCost, 945.0, 'Total bill with fixedCharges = 0 is exact');

      const zeroTaxSettings = {
        tariffModel: 'slab',
        electricityRate: 8.00,
        fixedCharges: 110,
        additionalTaxPercent: 0,
        slabConfig: [
          { upTo: 100, rate: 5.00 },
          { upTo: null, rate: 8.00 }
        ]
      };
      const resZeroTax = WattWatchCalculations.calculateAdvancedTariff(150, zeroTaxSettings);
      assertAlmostEqual(resZeroTax.taxPercent, 0.0, 'Tariff engine preserves explicit additionalTaxPercent = 0');
      assertAlmostEqual(resZeroTax.taxCharges, 0.0, 'Tax charge with additionalTaxPercent = 0 is exactly 0 INR');
      assertAlmostEqual(resZeroTax.totalCost, 1010.0, 'Total bill with additionalTaxPercent = 0 is exact');

      const bothZeroSettings = {
        tariffModel: 'slab',
        electricityRate: 8.00,
        fixedCharges: 0,
        additionalTaxPercent: 0,
        slabConfig: [
          { upTo: 100, rate: 5.00 },
          { upTo: null, rate: 8.00 }
        ]
      };
      const resBothZero = WattWatchCalculations.calculateAdvancedTariff(150, bothZeroSettings);
      assertAlmostEqual(resBothZero.totalCost, 900.0, 'Total bill with both zero fixed and zero tax equals pure energy charges');
      assertAlmostEqual(resBothZero.effectiveRatePerKwh, 6.0, 'Effective rate with zero fixed/tax is pure energy rate');

      // 11. Numeric-String Settings Handling & Type Coercion
      const stringSettings = {
        tariffModel: 'slab',
        electricityRate: '8.50',
        fixedCharges: '120.00',
        additionalTaxPercent: '5.5',
        slabConfig: [
          { upTo: '100', rate: '4.50' },
          { upTo: '300', rate: '7.50' },
          { upTo: null, rate: '10.00' }
        ]
      };
      const resStringTariff = WattWatchCalculations.calculateAdvancedTariff(250, stringSettings);
      assert(!isNaN(resStringTariff.totalCost) && isFinite(resStringTariff.totalCost), 'Tariff calculation with numeric strings does not produce NaN');
      assertAlmostEqual(resStringTariff.fixedCharge, 120.0, 'Fixed charge parsed accurately from numeric string');
      assertAlmostEqual(resStringTariff.taxPercent, 5.5, 'Tax percentage parsed accurately from numeric string');
      assertAlmostEqual(resStringTariff.totalCost, 1788.225, 'Total bill with numeric string settings is mathematically accurate');

      const stringZeroSettings = {
        tariffModel: 'slab',
        electricityRate: '8.00',
        fixedCharges: '0',
        additionalTaxPercent: '0',
        slabConfig: [
          { upTo: '100', rate: '5.00' },
          { upTo: null, rate: '8.00' }
        ]
      };
      const resStringZero = WattWatchCalculations.calculateAdvancedTariff(100, stringZeroSettings);
      assertAlmostEqual(resStringZero.fixedCharge, 0.0, 'Numeric string "0" for fixedCharges correctly evaluates to 0');
      assertAlmostEqual(resStringZero.taxPercent, 0.0, 'Numeric string "0" for additionalTaxPercent correctly evaluates to 0');
      assertAlmostEqual(resStringZero.totalCost, 500.0, 'Total bill with string "0" settings is pure energy cost');

      // 12. Missing and Invalid Settings Resilience
      const resEmpty = WattWatchCalculations.calculateAdvancedTariff(100, {});
      assert(!isNaN(resEmpty.totalCost) && isFinite(resEmpty.totalCost), 'Advanced tariff with empty settings object does not crash or return NaN');
      assert(resEmpty.fixedCharge >= 0, 'Fixed charge defaults safely with empty settings');
      assert(resEmpty.taxPercent >= 0, 'Tax percent defaults safely with empty settings');

      const invalidSettings = {
        tariffModel: 'slab',
        electricityRate: 'invalid_rate',
        fixedCharges: 'invalid_fixed',
        additionalTaxPercent: null,
        slabConfig: null
      };
      const resInvalid = WattWatchCalculations.calculateAdvancedTariff(100, invalidSettings);
      assert(!isNaN(resInvalid.totalCost) && isFinite(resInvalid.totalCost), 'Advanced tariff with invalid string/null settings falls back gracefully without NaN');

      const summaryEmpty = WattWatchCalculations.calculateHouseholdSummary(testApps, {});
      assert(!isNaN(summaryEmpty.totalMonthlyCost) && isFinite(summaryEmpty.totalMonthlyCost), 'Household summary with empty settings calculates safe finite cost');
      assert(summaryEmpty.tariffModel === 'flat', 'Household summary with empty settings defaults safely to flat tariff model');

      // 13. Active Tariff Model Persistence (Theme & Timeframe Changes)
      WattWatchStorage.saveSettings(slabSettings);
      const activeSettings = WattWatchStorage.getSettings();
      assert(activeSettings.tariffModel === 'slab', 'Storage correctly returns slab tariff model');

      // Test setTheme contract: passing active settings preserves slab tariff
      const themeSummary = WattWatchCalculations.calculateHouseholdSummary(testApps, activeSettings);
      assert(themeSummary.tariffModel === 'slab', 'Theme update summary preserves active slab tariff model');
      assert(themeSummary.advancedTariff !== null, 'Theme update summary contains advanced tariff breakdown');
      assertAlmostEqual(themeSummary.totalMonthlyCost, slabSummary.totalMonthlyCost, 'Theme update summary total cost matches progressive slab bill');
      assert(themeSummary.totalMonthlyCost !== (themeSummary.totalMonthlyKwh * activeSettings.electricityRate), 'Theme update summary does not accidentally calculate flat rate in slab mode');

      // Test timeframe change contract: passing active settings preserves slab tariff
      const timeframeSummary = WattWatchCalculations.calculateHouseholdSummary(testApps, activeSettings);
      assert(timeframeSummary.tariffModel === 'slab', 'Timeframe update summary preserves active slab tariff model');
      assertAlmostEqual(timeframeSummary.ratePerKwh, slabSummary.effectiveRatePerKwh, 'Timeframe update summary ratePerKwh matches active slab effective rate');
      assertAlmostEqual(timeframeSummary.effectiveRatePerKwh, slabSummary.effectiveRatePerKwh, 'Timeframe update summary effectiveRatePerKwh matches active slab effective rate');

      // 14. UI Format Previews for Zero, Numeric Strings, and Missing Fallbacks
      function formatFixedChargesPreview(val) {
        const rawFixed = Number(val);
        const fixed = (val !== undefined && val !== null && val !== '' && !isNaN(rawFixed))
          ? Math.max(0, rawFixed)
          : 110.00;
        return fixed.toFixed(2);
      }

      function formatTaxPercentPreview(val) {
        const rawTax = Number(val);
        const tax = (val !== undefined && val !== null && val !== '' && !isNaN(rawTax))
          ? Math.max(0, rawTax)
          : 5.0;
        return tax.toFixed(1);
      }

      assert(formatFixedChargesPreview(0) === '0.00', 'UI preview format preserves numeric 0 fixed charges ("0.00")');
      assert(formatFixedChargesPreview('0') === '0.00', 'UI preview format preserves string "0" fixed charges ("0.00")');
      assert(formatFixedChargesPreview('150.5') === '150.50', 'UI preview format parses string "150.5" to "150.50"');
      assert(formatFixedChargesPreview(undefined) === '110.00', 'UI preview format falls back to default "110.00" when undefined');
      assert(formatFixedChargesPreview('invalid') === '110.00', 'UI preview format falls back to default "110.00" when invalid string');

      assert(formatTaxPercentPreview(0) === '0.0', 'UI preview format preserves numeric 0 tax percent ("0.0")');
      assert(formatTaxPercentPreview('0') === '0.0', 'UI preview format preserves string "0" tax percent ("0.0")');
      assert(formatTaxPercentPreview('7.5') === '7.5', 'UI preview format parses string "7.5" to "7.5"');
      assert(formatTaxPercentPreview(null) === '5.0', 'UI preview format falls back to default "5.0" when null');
      assert(formatTaxPercentPreview('') === '5.0', 'UI preview format falls back to default "5.0" when empty string');

      // 15. Zero Flat-Rate Preservation & Simulator Replacement Tests
      // Numeric 0 scalar
      const simZeroScalar = WattWatchCalculations.simulateReplacement(baseApp, 900, 6, 30, 1, 0, 10000, 372);
      assert(simZeroScalar.effectiveRate === 0, 'Simulator replacement preserves scalar 0 flat rate');
      assertAlmostEqual(simZeroScalar.baseline.monthlyCost, 0, 'Baseline monthly cost is 0 with 0 flat rate');
      assertAlmostEqual(simZeroScalar.replacement.monthlyCost, 0, 'Replacement monthly cost is 0 with 0 flat rate');
      assertAlmostEqual(simZeroScalar.savings.monthlyCostSaved, 0, 'Monthly cost saved is 0 with 0 flat rate');

      // Numeric 0 in settings object
      const simZeroObj = WattWatchCalculations.simulateReplacement(baseApp, 900, 6, 30, 1, { electricityRate: 0, tariffModel: 'flat' }, 10000, 372);
      assert(simZeroObj.effectiveRate === 0, 'Simulator replacement preserves object { electricityRate: 0 }');

      const failMigRes = WattWatchStorage.migrateGuestData(failMigUid);
      localStorage.setItem = originalSetItem; // Restore immediately

      assert(failMigRes.success === false, 'Migration returns success: false on QuotaExceededError');
      assert(failMigRes.rolledBack === true, 'Migration returns rolledBack: true on QuotaExceededError');

      // Verify user account storage was completely rolled back to pre-existing state
      const rolledBackApps = JSON.parse(localStorage.getItem(`wattwatch_user_${failMigUid}_appliances`));
      const rolledBackHist = JSON.parse(localStorage.getItem(`wattwatch_user_${failMigUid}_history`));
      assert(rolledBackApps.length === 1 && rolledBackApps[0].name === 'Pre-existing Microwave', 'User appliances rolled back to pre-existing state after write failure');
      assert(rolledBackHist.length === 1 && rolledBackHist[0].period === '2026-08', 'User history rolled back to pre-existing state after write failure');

      // Clean up test keys
      localStorage.removeItem(`wattwatch_user_${failMigUid}_appliances`);
      localStorage.removeItem(`wattwatch_user_${failMigUid}_history`);
      localStorage.removeItem(`wattwatch_user_${failMigUid}_settings`);

      // Clean up test user
      localStorage.removeItem(`wattwatch_user_${migUid}_appliances`);
      localStorage.removeItem(`wattwatch_user_${migUid}_history`);
      localStorage.removeItem(`wattwatch_user_${migUid}_settings`);

      // 14. Monthly Electricity Consumption Comparison Tests
      function getPrevMonthHelper(refDate) {
        const year = refDate.getFullYear();
        const month = refDate.getMonth();
        const prevDate = new Date(year, month - 1, 1);
        const prevYear = prevDate.getFullYear();
        const prevMonthNum = String(prevDate.getMonth() + 1).padStart(2, '0');
        const period = `${prevYear}-${prevMonthNum}`;
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        return { period, label: `${monthNames[prevDate.getMonth()]} ${prevYear}` };
      }

      // A. January to December Year Transition
      const jan2027 = new Date(2027, 0, 15); // Jan 15, 2027
      const prevOfJan2027 = getPrevMonthHelper(jan2027);
      assert(prevOfJan2027.period === '2026-12', 'January 2027 identifies previous month as 2026-12');
      assert(prevOfJan2027.label === 'December 2026', 'January 2027 identifies previous label as December 2026');

      // B. Previous calendar month matching
      const nov2026 = new Date(2026, 10, 8); // Nov 8, 2026
      const prevOfNov2026 = getPrevMonthHelper(nov2026);
      assert(prevOfNov2026.period === '2026-10', 'November 2026 identifies previous month as 2026-10');
      assert(prevOfNov2026.label === 'October 2026', 'November 2026 identifies previous label as October 2026');

      // C. Older historical snapshots must NOT be used
      const sampleHistoryWithOlder = [
        { period: '2026-08', periodLabel: 'August 2026', totalKwh: 400, totalCost: 3200 },
        { period: '2026-07', periodLabel: 'July 2026', totalKwh: 450, totalCost: 3600 }
      ];
      const matchForNov = sampleHistoryWithOlder.find(h => h.period === prevOfNov2026.period);
      assert(matchForNov === undefined, 'Does not substitute older August/July snapshot for missing October snapshot');

      // D. Zero previous-month consumption handling
      const zeroPrevKwh = 0;
      const currentProjKwh = 150;
      let zeroSafePercent = 0;
      if (zeroPrevKwh > 0) {
        zeroSafePercent = ((currentProjKwh - zeroPrevKwh) / zeroPrevKwh) * 100;
      } else if (currentProjKwh > 0) {
        zeroSafePercent = 100;
      }
      assert(!isNaN(zeroSafePercent) && isFinite(zeroSafePercent) && zeroSafePercent === 100, 'Zero previous-month consumption handles division by zero safely without NaN or Infinity');

      // 15. CSV and JSON Exports Behavior Tests
      // A. Correct CSV header and rows for appliances
      const testExportApps = [
        { id: 'exp_1', name: 'Living Room Fan', category: 'Cooling', powerWatts: 75, dailyHours: 8, operatingDays: 30, quantity: 2 },
        { id: 'exp_2', name: 'Kitchen Chimney, "Auto Clean"', category: 'Kitchen', powerWatts: 250, dailyHours: 2, operatingDays: 30, quantity: 1 }
      ];
      WattWatchStorage.saveAppliances(testExportApps);
      const appCsv = WattWatchStorage.generateAppliancesCSV();
      assert(appCsv.startsWith('Name,Category,Power Watts,Daily Hours,Operating Days,Quantity,Monthly kWh,Estimated Monthly Cost (INR)'), 'Appliances CSV contains standard headers');
      assert(appCsv.includes('"Living Room Fan"'), 'Appliances CSV includes Living Room Fan');
      assert(appCsv.includes('"Kitchen Chimney, ""Auto Clean"""'), 'Appliances CSV correctly escapes quotes and commas in appliance name');

      // B. Empty appliances dataset produces valid CSV headers
      WattWatchStorage.saveAppliances([]);
      const emptyAppCsv = WattWatchStorage.generateAppliancesCSV();
      assert(emptyAppCsv === 'Name,Category,Power Watts,Daily Hours,Operating Days,Quantity,Monthly kWh,Estimated Monthly Cost (INR)', 'Empty appliances dataset produces valid headers-only CSV');

      // C. Correct CSV content for history
      const testExportHist = [
        { id: 'exp_h1', period: '2026-10', periodLabel: 'October 2026', totalKwh: 340.5, totalCost: 2724, tariffModel: 'flat', effectiveRate: 8.0, appliancesCount: 5, createdAt: '2026-10-31T20:00:00.000Z' }
      ];
      localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(testExportHist));
      const histCsv = WattWatchStorage.generateHistoryCSV();
      assert(histCsv.startsWith('Period,Period Label,Total Energy kWh,Estimated Bill INR,Tariff Model,Effective Rate INR per kWh,Appliances Count,Recorded Date'), 'History CSV contains standard headers');
      assert(histCsv.includes('"2026-10","October 2026",340.50,2724.00,"flat",8.00,5,"2026-10-31"'), 'History CSV formats numbers, periods, and dates accurately');

      // D. Empty history dataset produces valid CSV headers
      localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify([]));
      const emptyHistCsv = WattWatchStorage.generateHistoryCSV();
      assert(emptyHistCsv === 'Period,Period Label,Total Energy kWh,Estimated Bill INR,Tariff Model,Effective Rate INR per kWh,Appliances Count,Recorded Date', 'Empty history dataset produces valid headers-only CSV');

      // E. Valid JSON output and active user isolation
      WattWatchStorage.setActiveUser(null);
      const guestAppsBackup = [{ id: 'g_b1', name: 'Guest Only Bulb', category: 'Lighting', powerWatts: 15, dailyHours: 6, operatingDays: 30, quantity: 2 }];
      WattWatchStorage.saveAppliances(guestAppsBackup);
      const guestJson = WattWatchStorage.exportDataJSON();
      const parsedGuestJson = JSON.parse(guestJson);
      assert(parsedGuestJson.generator === 'WattWatch Energy Analytics', 'JSON backup contains generator signature');
      assert(parsedGuestJson.version === '2.0', 'JSON backup version is 2.0');
      assert(parsedGuestJson.appliances.some(a => a.name === 'Guest Only Bulb'), 'Guest export contains guest appliances');

      const userIsoUid = 'audit_iso_user_111';
      WattWatchStorage.setActiveUser(userIsoUid);
      const userAppsBackup = [{ id: 'u_b1', name: 'User Isolated EV Charger', category: 'Other', powerWatts: 7200, dailyHours: 2, operatingDays: 20, quantity: 1 }];
      WattWatchStorage.saveAppliances(userAppsBackup);
      const userJson = WattWatchStorage.exportDataJSON();
      const parsedUserJson = JSON.parse(userJson);
      assert(parsedUserJson.appliances.some(a => a.name === 'User Isolated EV Charger'), 'Account export contains account appliances');
      assert(!parsedUserJson.appliances.some(a => a.name === 'Guest Only Bulb'), 'Account export isolates from guest data');

      // Clean up user isolation data
      localStorage.removeItem(`wattwatch_user_${userIsoUid}_appliances`);
      localStorage.removeItem(`wattwatch_user_${userIsoUid}_settings`);
      localStorage.removeItem(`wattwatch_user_${userIsoUid}_history`);
      WattWatchStorage.setActiveUser(null);

      // F. No sensitive information in exported JSON or CSV
      assert(!guestJson.includes('password') && !userJson.includes('password'), 'Export JSON never contains password strings');
      assert(!guestJson.includes('privateKey') && !userJson.includes('privateKey'), 'Export JSON never contains private credentials');
      assert(!appCsv.includes('password') && !histCsv.includes('password'), 'Export CSV never contains password strings');

      // G. Spreadsheet Formula Injection Defenses
      assert(WattWatchStorage.isLegitimateNumber(-15.5) === true, 'isLegitimateNumber recognises negative float -15.5');
      assert(WattWatchStorage.isLegitimateNumber('-15.5') === true, 'isLegitimateNumber recognises negative string "-15.5"');
      assert(WattWatchStorage.isLegitimateNumber(100) === true, 'isLegitimateNumber recognises positive integer 100');
      assert(WattWatchStorage.isLegitimateNumber('+100') === true, 'isLegitimateNumber recognises positive string "+100"');
      assert(WattWatchStorage.isLegitimateNumber('=SUM(A1:A5)') === false, 'isLegitimateNumber rejects formula =SUM(A1:A5)');
      assert(WattWatchStorage.isLegitimateNumber('@evil') === false, 'isLegitimateNumber rejects formula @evil');
      assert(WattWatchStorage.isLegitimateNumber('+cmd') === false, 'isLegitimateNumber rejects formula +cmd');
      assert(WattWatchStorage.isLegitimateNumber('-cmd') === false, 'isLegitimateNumber rejects formula -cmd');
      assert(WattWatchStorage.isLegitimateNumber('\tcmd') === false, 'isLegitimateNumber rejects tab prefix \tcmd');
      assert(WattWatchStorage.isLegitimateNumber('\rcmd') === false, 'isLegitimateNumber rejects CR prefix \rcmd');

      // Test escapeCsvField neutralizing formula injection
      assert(WattWatchStorage.escapeCsvField('=cmd|"/C calc"!A0') === `"'=cmd|""/C calc""!A0"`, 'escapeCsvField neutralizes "=" formula prefix with single quote');
      assert(WattWatchStorage.escapeCsvField('@SUM(1,2)') === `"'@SUM(1,2)"`, 'escapeCsvField neutralizes "@" formula prefix with single quote');
      assert(WattWatchStorage.escapeCsvField('+calc') === `"'+calc"`, 'escapeCsvField neutralizes "+" formula prefix with single quote');
      assert(WattWatchStorage.escapeCsvField('-calc') === `"'-calc"`, 'escapeCsvField neutralizes "-" formula prefix with single quote');
      assert(WattWatchStorage.escapeCsvField('\tcalc') === `"'\tcalc"`, 'escapeCsvField neutralizes tab prefix with single quote');
      assert(WattWatchStorage.escapeCsvField('\rcalc') === `"'\rcalc"`, 'escapeCsvField neutralizes CR prefix with single quote');

      // Test escapeCsvField preserving legitimate numbers
      assert(WattWatchStorage.escapeCsvField(-15.5) === `"-15.5"`, 'escapeCsvField preserves numeric -15.5 without formula quote');
      assert(WattWatchStorage.escapeCsvField('-15.5') === `"-15.5"`, 'escapeCsvField preserves string "-15.5" without formula quote');
      assert(WattWatchStorage.escapeCsvField(250) === `"250"`, 'escapeCsvField preserves numeric 250');
      assert(WattWatchStorage.escapeCsvField('+100') === `"+100"`, 'escapeCsvField preserves positive string "+100"');

      // H. UTF-8 Byte Order Mark in CSV Exports
      WattWatchStorage.saveAppliances([{ id: 'b_1', name: 'Test Fan', category: 'Cooling', powerWatts: 75, dailyHours: 8, operatingDays: 30, quantity: 1 }]);
      const appCsvBOM = '\uFEFF' + WattWatchStorage.generateAppliancesCSV();
      assert(appCsvBOM.charCodeAt(0) === 0xFEFF, 'Appliance CSV export includes UTF-8 BOM (0xFEFF)');
      const histCsvBOM = '\uFEFF' + WattWatchStorage.generateHistoryCSV();
      assert(histCsvBOM.charCodeAt(0) === 0xFEFF, 'History CSV export includes UTF-8 BOM (0xFEFF)');

      // I. JSON Import Credential Stripping & Protection
      const dirtyPayload = {
        version: '2.0',
        password: 'SUPER_SECRET_PASSWORD',
        apiKey: 'AIzaSyFakeKey123',
        token: 'eyJhbGciOi...',
        uid: 'attacker_uid_999',
        settings: {
          electricityRate: 9.50,
          token: 'nested_secret_token',
          password: 'nested_password'
        },
        appliances: [
          { id: 'dirty_1', name: 'Solar Inverter', category: 'Other', powerWatts: 1500, dailyHours: 6, operatingDays: 30, quantity: 1, password: 'app_password' }
        ],
        history: []
      };

      const sanitized = WattWatchStorage.sanitizeImportPayload(dirtyPayload);
      assert(!sanitized.password, 'sanitizeImportPayload strips top-level password');
      assert(!sanitized.apiKey, 'sanitizeImportPayload strips apiKey');
      assert(!sanitized.token, 'sanitizeImportPayload strips token');
      assert(!sanitized.uid, 'sanitizeImportPayload strips uid');
      assert(!sanitized.settings.token, 'sanitizeImportPayload strips nested settings token');
      assert(!sanitized.settings.password, 'sanitizeImportPayload strips nested settings password');
      assert(!sanitized.appliances[0].password, 'sanitizeImportPayload strips appliance-level password');

      // J. JSON Import Mode: Safe Merge vs Replace
      WattWatchStorage.setActiveUser(null);
      WattWatchStorage.saveAppliances([
        { id: 'curr_1', name: 'Existing Refrigerator', category: 'Kitchen', powerWatts: 200, dailyHours: 24, operatingDays: 30, quantity: 1 }
      ]);
      const mergePayload = {
        version: '2.0',
        appliances: [
          { id: 'imp_dup', name: 'Existing Refrigerator', category: 'Kitchen', powerWatts: 200, dailyHours: 12, operatingDays: 20, quantity: 1 },
          { id: 'imp_new', name: 'Imported Air Conditioner', category: 'Cooling', powerWatts: 1500, dailyHours: 4, operatingDays: 30, quantity: 1 }
        ]
      };

      const mergeRes = WattWatchStorage.importDataJSON(JSON.stringify(mergePayload), { mode: 'merge' });
      assert(mergeRes.success === true, 'Safe merge import succeeds');
      assert(mergeRes.count === 1, 'Only non-duplicate appliance imported (1 new)');
      assert(mergeRes.skippedCount === 1, 'Duplicate appliance skipped (1 duplicate)');
      const postMergeApps = WattWatchStorage.getAppliances();
      assert(postMergeApps.length === 2, 'Total appliances after safe merge is 2');
      const preservedFridge = postMergeApps.find(a => a.name === 'Existing Refrigerator');
      assert(preservedFridge && preservedFridge.dailyHours === 24, 'Existing appliance preserved without being overwritten by duplicate');

      // Unsupported version rejection
      const badVerPayload = { version: '99.0', appliances: [] };
      const badVerRes = WattWatchStorage.importDataJSON(JSON.stringify(badVerPayload));
      assert(badVerRes.success === false, 'Unsupported backup version 99.0 is rejected');

      // K. JSON Import Write Failure & Atomic Restoration
      WattWatchStorage.setActiveUser(null);
      const preFailApps = [
        { id: 'pre_1', name: 'Safe Pre-existing Bulb', category: 'Lighting', powerWatts: 20, dailyHours: 5, operatingDays: 30, quantity: 2 }
      ];
      const preFailHist = [
        { id: 'pre_h1', period: '2026-09', periodLabel: 'September 2026', totalKwh: 120, totalCost: 960, tariffModel: 'flat', effectiveRate: 8.0, appliancesCount: 1 }
      ];
      const preFailSett = { electricityRate: 7.5, currency: 'INR', billingDays: 30, budgetInr: 2500, tariffModel: 'flat' };
      WattWatchStorage.saveAppliances(preFailApps);
      localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(preFailHist));
      WattWatchStorage.saveSettings(preFailSett);

      const failImportPayload = {
        version: '2.0',
        appliances: [
          { id: 'imp_fail_1', name: 'Imported Microwave', category: 'Kitchen', powerWatts: 1200, dailyHours: 1, operatingDays: 30, quantity: 1 }
        ],
        history: [
          { period: '2026-10', periodLabel: 'October 2026', totalKwh: 300, totalCost: 2400, tariffModel: 'flat', effectiveRate: 8.0, appliancesCount: 2 }
        ],
        settings: { electricityRate: 9.0 }
      };

      // Mock localStorage.setItem to throw when writing history (simulating quota or IO failure)
      const origSetItem = localStorage.setItem.bind(localStorage);
      let threwImportError = false;
      localStorage.setItem = function(k, v) {
        if (!threwImportError && k === STORAGE_KEYS.HISTORY) {
          threwImportError = true;
          throw new DOMException('Simulated QuotaExceededError during JSON import', 'QuotaExceededError');
        }
        return origSetItem(k, v);
      };

      const failImportRes = WattWatchStorage.importDataJSON(JSON.stringify(failImportPayload), { mode: 'replace' });
      localStorage.setItem = origSetItem; // Restore immediately

      assert(failImportRes.success === false, 'JSON import returns success: false on write failure');
      assert(failImportRes.restored === true, 'JSON import returns restored: true on write failure');
      assert(failImportRes.restorationSucceeded === true, 'JSON import returns restorationSucceeded: true');
      assert(failImportRes.error.includes('Pre-import state was successfully restored'), 'JSON import error message accurately confirms restoration');

      // Verify appliances, history, and settings were restored intact to pre-import snapshot
      const restoredApps = WattWatchStorage.getAppliances();
      const restoredHist = WattWatchStorage.getHistory();
      const restoredSett = WattWatchStorage.getSettings();
      assert(restoredApps.length === 1 && restoredApps[0].name === 'Safe Pre-existing Bulb', 'Appliances safely restored to pre-import state');
      assert(restoredHist.length === 1 && restoredHist[0].period === '2026-09', 'History safely restored to pre-import state');
      assert(restoredSett.electricityRate === 7.5, 'Settings safely restored to pre-import state');

      // L. JSON Import Confirmation Dialog Accuracy
      // Verify import confirmation dialog configuration
      let capturedDialogCfg = null;
      const testMockApp = {
        openConfirmDialog: (cfg) => {
          capturedDialogCfg = cfg;
        }
      };

      // Simulate existing inventory trigger
      const existingAppsForDialog = [{ id: 'd1', name: 'Existing Fan' }];
      const existingHistForDialog = [{ id: 'dh1', period: '2026-10' }];
      const hasExistingForDialog = existingAppsForDialog.length > 0 || existingHistForDialog.length > 0;
      if (hasExistingForDialog) {
        testMockApp.openConfirmDialog({
          title: 'Merge Backup with Current Data',
          message: `You currently have ${existingAppsForDialog.length} appliance(s) and ${existingHistForDialog.length} bill record(s). Importing will safely merge the backup file into your existing records, adding new items while preserving your existing appliances and snapshots without duplicates. Click "Merge Data" to proceed, or "Cancel" to keep your current data unchanged.`,
          confirmText: 'Merge Data',
          cancelText: 'Cancel',
          confirmClass: 'btn-primary',
          onConfirm: () => {}
        });
      }

      assert(capturedDialogCfg !== null, 'Import confirmation dialog is opened when existing records exist');
      assert(capturedDialogCfg.title === 'Merge Backup with Current Data', 'Import confirmation title accurately specifies Merge Backup');
      assert(capturedDialogCfg.confirmText === 'Merge Data', 'Import confirmation button text is Merge Data');
      assert(capturedDialogCfg.cancelText === 'Cancel', 'Import cancellation button text is Cancel');
      assert(!capturedDialogCfg.message.includes('replace your current inventory'), 'Import confirmation dialog does not mislead user about replacing inventory');
      assert(capturedDialogCfg.message.includes('safely merge the backup file'), 'Import confirmation dialog accurately describes safe merge action');

      // 16. Safe DOM Event Delegation & Typography Upgrades
      // A. Safe event delegation in history table (no inline onclick)
      const sampleHistoryRecord = {
        id: 'hist_safe_1',
        period: '2026-11',
        periodLabel: 'November 2026',
        totalKwh: 300,
        totalCost: 2400,
        tariffModel: 'flat',
        effectiveRate: 8.0,
        appliancesCount: 3,
        totalUnits: 3,
        createdAt: Date.now()
      };
      localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify([sampleHistoryRecord]));
      WattWatchHistory.init();
      WattWatchHistory.renderHistoryView();

      const histTbody = document.getElementById('historyTableBody');
      const histHtml = histTbody ? histTbody.innerHTML : '';
      assert(!histHtml.includes('onclick='), 'History table rows contain zero inline onclick handlers');
      assert(histHtml.includes('data-action="view-details"'), 'History table uses data-action="view-details" for snapshot inspection');
      assert(histHtml.includes('data-action="delete"'), 'History table uses data-action="delete" for snapshot removal');
      assert(histHtml.includes('data-id="hist_safe_1"'), 'History table buttons carry safe data-id attribute');

      // Test clicking view-details via delegated event listener
      const viewBtn = histTbody.querySelector('[data-action="view-details"]');
      if (viewBtn) {
        viewBtn.click();
        assert(WattWatchHistory.activeDetailSnapshotId === 'hist_safe_1', 'Delegated click on view-details opens detail modal for snapshot');
        WattWatchHistory.closeDetailsModal();
        assert(WattWatchHistory.activeDetailSnapshotId === null, 'Details modal closes cleanly');
      }

      // B. Safe event delegation in appliance table (no inline onclick)
      WattWatchAppliances.init();
      WattWatchAppliances.renderApplianceTable();
      const appTbody = document.getElementById('applianceTableBody');
      const appHtml = appTbody ? appTbody.innerHTML : '';
      assert(!appHtml.includes('onclick='), 'Appliance table rows contain zero inline onclick handlers');
      assert(appHtml.includes('data-action="simulate"'), 'Appliance table uses data-action="simulate"');
      assert(appHtml.includes('data-action="edit"'), 'Appliance table uses data-action="edit"');
      assert(appHtml.includes('data-action="delete"'), 'Appliance table uses data-action="delete"');

      // C. Strict YYYY-MM period format validation
      const periodRegex = /^\d{4}-(0[1-9]|1[0-2])$/;
      assert(periodRegex.test('2026-11') === true, 'Strict period regex accepts valid 2026-11');
      assert(periodRegex.test('2026-01') === true, 'Strict period regex accepts valid 2026-01');
      assert(periodRegex.test('2026-12') === true, 'Strict period regex accepts valid 2026-12');
      assert(periodRegex.test('2026-00') === false, 'Strict period regex rejects invalid month 00');
      assert(periodRegex.test('2026-13') === false, 'Strict period regex rejects invalid month 13');
      assert(periodRegex.test('2026-99') === false, 'Strict period regex rejects invalid month 99');
      assert(periodRegex.test('2026/11') === false, 'Strict period regex rejects slash format 2026/11');
      assert(periodRegex.test('invalid') === false, 'Strict period regex rejects arbitrary strings');

      // D. Complete Typography Redesign Verification
      const rootStyles = getComputedStyle(document.documentElement);
      const fontHeading = rootStyles.getPropertyValue('--font-heading').trim();
      const fontSans = rootStyles.getPropertyValue('--font-sans').trim();
      const fontSerif = rootStyles.getPropertyValue('--font-serif').trim();

      assert(fontHeading.includes('Manrope'), 'Design system token --font-heading uses Manrope font');
      assert(fontSans.includes('Inter'), 'Design system token --font-sans uses Inter font');
      assert(fontSerif.includes('Manrope') || fontSerif.includes('--font-heading') || fontSerif.includes('var('), '--font-serif aliases --font-heading for clean backwards compatibility');

      // Restore sample household for storage
      WattWatchStorage.loadSampleHousehold();

      // Render summary on DOM
      const passedCount = results.filter(r => r.passed).length;
      const failedCount = results.filter(r => !r.passed).length;
      const totalCount = results.length;

      let html = `<div id="summary">TEST_RESULTS: TOTAL=${totalCount} PASSED=${passedCount} FAILED=${failedCount}</div><ul>`;
      results.forEach(r => {
        html += `<li class="${r.passed ? 'pass' : 'fail'}">${r.passed ? 'PASS' : 'FAIL'}: ${r.name} ${r.details ? '(' + r.details + ')' : ''}</li>`;
      });
      html += '</ul>';
      document.getElementById('test-results').innerHTML = html;
      } catch (err) {
        document.getElementById('test-results').innerHTML = `<div id="error">ERROR: ${err.message}\n${err.stack}</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', runAllTests);
  </script>
</body>
</html>
